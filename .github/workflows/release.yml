name: 发布客户端并更新官网下载
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 要发布的平台（Mac 请先运行原生构建验证）
        required: true
        type: choice
        options: [windows, macos]
      notes:
        description: 本版本更新说明（可填写多行）
        required: true
        type: string
  push:
    tags: ['windows-v*', 'macos-v*']
env:
  RELEASE_PLATFORM: ${{ inputs.platform || (startsWith(github.ref_name, 'macos-v') && 'macos' || 'windows') }}
permissions:
  contents: write
concurrency:
  group: daywish-release-${{ inputs.platform || (startsWith(github.ref_name, 'macos-v') && 'macos' || 'windows') }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ${{ (inputs.platform == 'macos' || startsWith(github.ref_name, 'macos-v')) && 'macos-latest' || 'windows-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: 校验版本与更新说明
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('版本号格式不合法')
          const platform = process.env.RELEASE_PLATFORM
          const ref = process.env.GITHUB_REF ?? ''
          if (ref.startsWith('refs/tags/') && ref.slice(10) !== `${platform}-v${version}`) throw new Error('标签必须与 package.json 版本及平台一致')
          const history = JSON.parse(fs.readFileSync('website/public/releases.json', 'utf8'))
          const known = history.releases.find(r => r.platform === platform && r.version === version)
          const notes = process.env.RELEASE_NOTES?.trim() || known?.notes.join('\n') || `发布 ${platform} v${version}`
          fs.writeFileSync('release-notes.txt', notes)
          NODE
      - run: pnpm test
      - if: env.RELEASE_PLATFORM == 'windows'
        run: pnpm package:win
      - if: env.RELEASE_PLATFORM == 'macos'
        run: bash macos/build.command
      - name: 构建随客户端一起发布的官网
        run: |
          pnpm site:build
          mkdir -p publication
          tar -czf publication/site.tgz -C website-dist .
      - name: 生成经过校验的版本记录
        env:
          PLATFORM: ${{ env.RELEASE_PLATFORM }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if [[ "$PLATFORM" == windows ]]; then
            FILE="release/Daywish-$VERSION-Windows-x64-Setup.exe"
          else
            FILE="macos/build/Daywish-$VERSION-macOS-$(uname -m).zip"
          fi
          mkdir -p publication
          cp "$FILE" publication/
          node scripts/make-release-record.mjs "$PLATFORM" "$FILE" publication/record.json release-notes.txt
          cp release-notes.txt publication/
      - uses: actions/upload-artifact@v4
        with:
          name: daywish-publication
          path: publication/*
          retention-days: 30
  publish:
    timeout-minutes: 30
    concurrency:
      group: daywish-production-deploy
      cancel-in-progress: false
    needs: package
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: daywish-publication
          path: publication
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ env.RELEASE_PLATFORM }}
        run: node scripts/publish-github.mjs
      # GITHUB_TOKEN 创建 Release 不会再触发普通 Release 事件，故在同一流水线里直接部署。
      - name: 同步安装包并更新官网下载信息
        env:
          DEPLOY_HOST: '152.136.107.93'
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_DELIVERY: ${{ vars.DOWNLOAD_DELIVERY || 'github' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'alvis' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(python3 -c 'import json;print(json.load(open("publication/record.json"))["file"])')"
          bash ops/deploy-remote.sh release "publication/$FILE" publication/record.json publication/site.tgz
