name: 更新官方网站
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/components/**'
      - 'src/lib/dates.ts'
      - 'src/types/**'
      - 'src/styles/**'
      - 'shared/**'
      - 'public/icon.png'
      - 'scripts/prepare-site.mjs'
      - 'ops/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/website.yml'
permissions:
  contents: read
concurrency:
  group: daywish-website
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: python3 -m unittest discover -s tests -p 'test_deploy.py'
      - run: pnpm site:build
      - run: tar -czf daywish-site.tgz -C website-dist .
      - uses: actions/upload-artifact@v4
        with:
          name: daywish-website
          path: daywish-site.tgz
          retention-days: 14
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: daywish-website
      - name: 初始化服务并部署官网（由 GitHub Actions 连接服务器）
        env:
          DEPLOY_HOST: '152.136.107.93'
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'alvis' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash ops/deploy-remote.sh site daywish-site.tgz
