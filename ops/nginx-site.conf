server {
    listen 8080;
    server_name _;
    root /srv/daywish/current;
    index index.html;
    server_tokens off;
    charset utf-8;

    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
    location = /releases.json {
        alias /srv/daywish/state/releases.json;
        add_header Cache-Control "no-store" always;
    }
    location = /build.json { add_header Cache-Control "no-store" always; }
    location /downloads/ {
        alias /srv/daywish/downloads/;
        autoindex off;
        default_type application/octet-stream;
        add_header Content-Disposition attachment;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache" always; }
}
