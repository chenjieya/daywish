name: 验证与构建 Mac 原生版
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['macos/**', 'shared/**', '.github/workflows/macos.yml', 'scripts/annotate-swift.py', 'ops/mac-update-*']
permissions:
  contents: read
jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: 准备 Mac 更新公钥
        shell: bash
        env:
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash ops/mac-update-remote.sh prepare
      - name: 检查构建环境
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: 测试并构建本机架构应用
        shell: bash
        env:
          DAYWISH_SMOKE_TEST: '1'
        run: |
          set +e
          bash macos/build.command 2>&1 | tee macos-build.log
          RESULT=${PIPESTATUS[0]}
          set -e
          python3 scripts/annotate-swift.py macos-build.log
          exit "$RESULT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Daywish-macOS-build-log
          path: macos-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: Daywish-macOS
          path: macos/build/*.zip
          if-no-files-found: error
